name: build

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    TESTCONTAINERS_RYUK_DISABLED: true

jobs:
    dependencies:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Java Setup
              uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: maven

            - name: Build
              run: |
                  for module in parent starter; do
                      mvn --batch-mode --quiet --errors --no-transfer-progress clean install --file "$module"
                  done

            - name: Upload Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dependencies
                  path: ~/.m2/repository/com/company
                  retention-days: 1

    services:
        needs: dependencies
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: true
            matrix:
                service:
                    - authservice
                    - configurationservice
                    - customerservice
                    - productservice
                    - orderservice
                    - paymentservice
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Java Setup
              uses: actions/setup-java@v6
              with:
                  java-version: 25
                  distribution: temurin
                  cache: maven

            - name: Download Artifacts
              uses: actions/download-artifact@v8
              with:
                  name: dependencies
                  path: ~/.m2/repository/com/company

            - name: Build ${{ matrix.service }}
              run: mvn --batch-mode --quiet --errors --no-transfer-progress clean verify
              working-directory: ${{ matrix.service }}
